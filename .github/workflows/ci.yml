name: "CI"

on:
  push:
    branches: [main, dev, "feature/**", "task/**"]
  pull_request:
    branches: [main, dev, "feature/**"]

permissions:
  contents: read

jobs:
  verify:
    name: "Typecheck, Test & Verify Pre-bundled Actions"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Provision Ubuntu 26.04 kernel sandbox (landrun + bubblewrap) & stateless RTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends landrun bubblewrap ca-certificates curl
          # renovate: datasource=github-releases depName=rtk-ai/rtk
          RTK_VERSION="v1.0.1"
          RTK_ARCHIVE="rtk-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "https://github.com/rtk-ai/rtk/releases/download/${RTK_VERSION}/${RTK_ARCHIVE}" -o "/tmp/${RTK_ARCHIVE}"
          curl -fsSL "https://github.com/rtk-ai/rtk/releases/download/${RTK_VERSION}/checksums.txt" -o "/tmp/rtk-checksums.txt"
          (cd /tmp && sha256sum --check --ignore-missing rtk-checksums.txt)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "/tmp/${RTK_ARCHIVE}" -C "$RUNNER_TEMP/bin" rtk
          chmod 0755 "$RUNNER_TEMP/bin/rtk"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "RTK_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
          echo "RTK_RECALL=0" >> "$GITHUB_ENV"
          echo "RTK_TEE=0" >> "$GITHUB_ENV"
          echo "NO_COLOR=1" >> "$GITHUB_ENV"

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Rebuild Custom Action bundles
        run: npm run build

      - name: Verify dist/ bundles are up to date
        run: git diff --exit-code dist/

      - name: Run test suite
        run: npm test

      - name: Run iFixAi deterministic authorization trajectory audit
        uses: ./actions/audit-ifixai
        with:
          mode: "deterministic_ci"
          steps_json: >-
            [
              {"stepId":"step-1-task-branch","actor":"epure-agent[bot]","effectivePermission":"write","appRole":"agent","operation":"push_task_branch","targetBranchOrRef":"task/24-domain-formulas"},
              {"stepId":"step-2-task-pr","actor":"epure-agent[bot]","effectivePermission":"write","appRole":"agent","operation":"open_pull_request","targetBranchOrRef":"feature/16-enclume"},
              {"stepId":"step-3-release-tag","actor":"epure-release[bot]","effectivePermission":"write","appRole":"release","operation":"create_release_tag","targetBranchOrRef":"refs/tags/v1.0.0"}
            ]


