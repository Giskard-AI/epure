name: "CI"

on:
  push:
    branches: [main, dev, "feature/**", "task/**"]
  pull_request:
    branches: [main, dev, "feature/**"]

permissions:
  contents: read

jobs:
  verify:
    name: "Typecheck, Test & Verify Pre-bundled Actions"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Rebuild Custom Action bundles
        run: npm run build

      - name: Verify dist/ bundles are up to date
        run: git diff --exit-code dist/

      - name: Run test suite
        run: npm test

      - name: Run iFixAi deterministic authorization trajectory audit
        uses: ./actions/audit-ifixai
        with:
          mode: "deterministic_ci"
          steps_json: >-
            [
              {"id":"step-1-auth-gate","actor":"human-maintainer","effectivePermission":"write","action":"dispatch_command","appContext":"agent"},
              {"id":"step-2-task-pr","actor":"epure-agent[bot]","effectivePermission":"write","action":"open_pr","appContext":"agent","delegatedBy":"human-maintainer"},
              {"id":"step-3-release-tag","actor":"epure-release[bot]","effectivePermission":"write","action":"publish_release","appContext":"release","delegatedBy":"human-maintainer"}
            ]

