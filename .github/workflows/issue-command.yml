name: "EPURE Reusable Issue Command Gate & Orchestrator"

on:
  workflow_call:
    inputs:
      repository:
        description: "Target GitHub repository slug (<owner>/<repo>)"
        required: true
        type: string
      issue_number:
        description: "GitHub Issue number receiving the command"
        required: true
        type: number
      comment_id:
        description: "GitHub Issue Comment ID for cursor tracking"
        required: false
        type: number
        default: 0
      comment_body:
        description: "Raw issue comment body"
        required: true
        type: string
      actor:
        description: "GitHub login of the comment author"
        required: true
        type: string
      actor_type:
        description: "GitHub actor type ('User', 'Bot', 'Organization')"
        required: false
        type: string
        default: "User"
      author_association:
        description: "Event author_association (informational only)"
        required: false
        type: string
        default: ""
      issue_labels:
        description: "Comma-separated issue labels (informational only)"
        required: false
        type: string
        default: ""
      effective_permission:
        description: "Optional pre-verified effective permission override for deterministic testing"
        required: false
        type: string
        default: ""
      llm_environment:
        description: "GitHub Environment holding LLM_API_KEY (defaults to 'epure-agent')"
        required: false
        type: string
        default: "epure-agent"
    secrets:
      EPURE_AGENT_APP_ID:
        description: "Consumer Agent App ID"
        required: false
      EPURE_AGENT_APP_PRIVATE_KEY:
        description: "Consumer Agent App PEM private key"
        required: false
    outputs:
      authorized:
        description: "Whether the command is authorized ('true' or 'false')"
        value: ${{ jobs.authorize-command.outputs.authorized }}
      decision:
        description: "Authorization decision code"
        value: ${{ jobs.authorize-command.outputs.decision }}
      command:
        description: "Parsed EPURE command"
        value: ${{ jobs.authorize-command.outputs.command }}
      command_args:
        description: "Parsed EPURE command arguments"
        value: ${{ jobs.authorize-command.outputs.command_args }}
      effective_permission:
        description: "Verified repository permission level"
        value: ${{ jobs.authorize-command.outputs.effective_permission }}
      privileged_action_allowed:
        description: "Whether privileged state/branch/PR actions may proceed"
        value: ${{ jobs.authorize-command.outputs.privileged_action_allowed }}
      llm_call_allowed:
        description: "Whether LLM execution may proceed"
        value: ${{ jobs.authorize-command.outputs.llm_call_allowed }}
      error_code:
        description: "Deterministic error code"
        value: ${{ jobs.authorize-command.outputs.error_code }}

permissions:
  contents: read
  issues: write

jobs:
  authorize-command:
    name: "Authorize /epure Issue Command"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
      decision: ${{ steps.gate.outputs.decision }}
      command: ${{ steps.gate.outputs.command }}
      command_args: ${{ steps.gate.outputs.command_args }}
      effective_permission: ${{ steps.gate.outputs.effective_permission }}
      privileged_action_allowed: ${{ steps.gate.outputs.privileged_action_allowed }}
      llm_call_allowed: ${{ steps.gate.outputs.llm_call_allowed }}
      error_code: ${{ steps.gate.outputs.error_code }}
    steps:
      - name: Checkout EPURE framework bundle
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Giskard-AI/epure
          ref: ${{ job.workflow_sha || 'main' }}
          persist-credentials: false

      - name: Run pre-bundled EPURE authorization gate
        id: gate
        uses: ./actions/authorize-command
        with:
          repository: ${{ inputs.repository }}
          issue_number: ${{ inputs.issue_number }}
          comment_body: ${{ inputs.comment_body }}
          actor: ${{ inputs.actor }}
          actor_type: ${{ inputs.actor_type }}
          author_association: ${{ inputs.author_association }}
          issue_labels: ${{ inputs.issue_labels }}
          effective_permission: ${{ inputs.effective_permission }}
          allow_implicit_planning_reply: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}

  orchestrate-command:
    name: "Orchestrate Authorized /epure Lifecycle"
    needs: authorize-command
    if: ${{ needs.authorize-command.outputs.authorized == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: ${{ inputs.llm_environment || 'epure-agent' }}
    concurrency:
      group: epure-issue-${{ inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: Checkout EPURE framework bundle
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Giskard-AI/epure
          ref: ${{ job.workflow_sha || 'main' }}
          persist-credentials: false

      - name: Provision Ubuntu 26.04 kernel sandbox (landrun + bubblewrap) & stateless RTK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends landrun bubblewrap ca-certificates curl
          # renovate: datasource=github-releases depName=rtk-ai/rtk
          RTK_VERSION="v1.0.1"
          RTK_ARCHIVE="rtk-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "https://github.com/rtk-ai/rtk/releases/download/${RTK_VERSION}/${RTK_ARCHIVE}" -o "/tmp/${RTK_ARCHIVE}"
          curl -fsSL "https://github.com/rtk-ai/rtk/releases/download/${RTK_VERSION}/checksums.txt" -o "/tmp/rtk-checksums.txt"
          (cd /tmp && sha256sum --check --ignore-missing rtk-checksums.txt)
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "/tmp/${RTK_ARCHIVE}" -C "$RUNNER_TEMP/bin" rtk
          chmod 0755 "$RUNNER_TEMP/bin/rtk"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "RTK_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
          echo "RTK_RECALL=0" >> "$GITHUB_ENV"
          echo "RTK_TEE=0" >> "$GITHUB_ENV"
          echo "NO_COLOR=1" >> "$GITHUB_ENV"
          echo "EPURE_ENFORCE_KERNEL_SANDBOX=true" >> "$GITHUB_ENV"

      - name: Run pre-bundled EPURE issue orchestrator
        id: orchestrate
        uses: ./actions/orchestrate-issue
        with:
          repository: ${{ inputs.repository }}
          issue_number: ${{ inputs.issue_number }}
          command: ${{ needs.authorize-command.outputs.command }}
          command_args: ${{ needs.authorize-command.outputs.command_args }}
          comment_id: ${{ inputs.comment_id }}
          actor: ${{ inputs.actor }}
          agent_app_id: ${{ secrets.EPURE_AGENT_APP_ID }}
          agent_app_private_key: ${{ secrets.EPURE_AGENT_APP_PRIVATE_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
